# Sandbox Horizon: comandos e configurações, sem precisar do jogo completo.
[[step]]
expect.commands = ["appleskin"]

[[step]]
command = "appleskin help"
expect.feedback = "Comandos: /appleskin [toggle|overlay|pulse|status|compact|position|help]."

[[step]]
command = "appleskin status"
expect.feedback = "AppleSkin ligado: segure uma comida na mão principal."

[[step]]
command = "appleskin"
expect.feedback = "AppleSkin desligado."

[[step]]
command = "appleskin status"
expect.feedback = "AppleSkin desligado. Use /appleskin para ligar."

[[step]]
command = "appleskin"
expect.feedback = "AppleSkin ligado."

[[step]]
command = "appleskin compact"
expect.feedback = "Modo compacto ligado."

[[step]]
command = "appleskin position"
expect.feedback = "Posição: Canto superior esquerdo"

[[step]]
command = "appleskin nonsense"
expect.error = "Argumento desconhecido: nonsense. Use /appleskin help."

[[step]]
command = "appleskin overlay"
expect.feedback = "Prévia de ícones desligada (painel de texto)."

[[step]]
command = "appleskin overlay"
expect.feedback = "Prévia de ícones acima da barra ligada."

[[step]]
command = "appleskin pulse"
expect.feedback = "Pulsação de opacidade desligada."

[[step]]
command = "appleskin pulse"
expect.feedback = "Pulsação de opacidade ligada."
