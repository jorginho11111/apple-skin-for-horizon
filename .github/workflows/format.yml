name: Temporary Rust formatter

on:
  push:
    branches: ["arena/eb13e5b2-apple-skin-for-horizon"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/format.yml"

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Format Rust sources
        run: cargo +1.95.0 fmt
      - name: Commit formatting only when needed
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format v0.4.2 Rust sources"
          git push origin HEAD:arena/eb13e5b2-apple-skin-for-horizon
