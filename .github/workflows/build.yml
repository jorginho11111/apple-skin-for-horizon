name: Build AppleSkin Android hmod

on:
  push:
    branches: ["arena/4949d79d-apple-skin-for-horizon", main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar/atualizar a Release versionada a partir deste commit"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hmod-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST: "1.95.0"
  CARGO_TERM_COLOR: always
  HORIZON_ANDROID_REVISION: "80700a6f26afe53a368032d8b28bd364f7c3e7e4"

jobs:
  build:
    name: Test, build and check .hmod
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: hmod-${{ env.RUST }}-${{ hashFiles('Cargo.lock', 'compatibility.json') }}
          restore-keys: hmod-${{ env.RUST }}-

      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: |
          mkdir -p target/report
          status=0
          cargo clippy --all-targets --locked --message-format=json -- -D warnings > target/report/clippy.json 2> target/report/clippy.stderr || status=$?
          CLIPPY_STATUS="$status" python3 - <<'PY'
          import json
          from pathlib import Path
          for line in Path("target/report/clippy.json").read_text().splitlines():
              try:
                  m = json.loads(line)
              except Exception:
                  continue
              if m.get("reason") != "compiler-message":
                  continue
              msg = m.get("message", {})
              if msg.get("level") not in ("error", "warning"):
                  continue
              text = msg.get("message", "")
              spans = msg.get("spans") or []
              span = next((s for s in spans if s.get("is_primary")), spans[0] if spans else {})
              file = span.get("file_name", ".github")
              line_no = span.get("line_start", 1)
              print(f"::{msg['level']} file={file},line={line_no}::{text}")
          err = Path("target/report/clippy.stderr").read_text()
          if err.strip():
              tail = err[-6000:]
              print(tail)
              import os
              if os.environ.get("CLIPPY_STATUS", "0") != "0":
                  for chunk in [tail[i:i+900] for i in range(0, len(tail), 900)]:
                      safe = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error file=Cargo.toml,line=1::{safe}")
          PY
          exit "$status"

      - name: Host tests
        run: cargo test --locked

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmod-diagnostics
          path: target/report/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Install official Horizon mod tool
        run: |
          cargo install --git https://github.com/Vasysik/horizon-android --rev "$HORIZON_ANDROID_REVISION" cargo-horizon-mod --locked

      - name: Build WebAssembly component and .hmod
        run: cargo horizon-mod build

      - name: Official registry check and sandbox trial
        run: |
          mkdir -p target/report
          cargo horizon-mod check target/horizon-mod/appleskin.hmod --json | tee target/report/check.json

      - name: Official sandbox scripts
        run: cargo horizon-mod test --hmod target/horizon-mod/appleskin.hmod

      - name: Package release files and build report
        run: python3 tools/package.py

      - name: Verify final archive
        run: |
          python3 - <<'PY'
          import hashlib, json, tomllib, zipfile
          from pathlib import Path
          version = json.loads(Path("compatibility.json").read_text())["mod_version"]
          path = Path("target/release") / f"appleskin-{version}-android.hmod"
          assert path.is_file(), f"missing exact-version package: {path}"
          expected_files = {path.name, f"{path.name}.sha256"}
          actual_files = {p.name for p in path.parent.iterdir()}
          assert actual_files == expected_files, f"stale or missing release files: {actual_files}"
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            names = z.namelist()
            assert names == ["horizon-mod.toml", "mod.wasm"], names
            manifest = tomllib.loads(z.read("horizon-mod.toml").decode())
            assert manifest["id"] == "appleskin"
            assert manifest["api"] == "0.1"
            assert manifest["version"] == version
            wasm = z.read("mod.wasm")
            assert wasm[:4] == b"\x00asm"
            assert len(wasm) < 32 * 1024 * 1024
          sha = hashlib.sha256(path.read_bytes()).hexdigest()
          checksum_file = path.with_name(f"{path.name}.sha256")
          assert checksum_file.read_text() == f"{sha}  {path.name}\n"
          report = json.loads(Path("target/report/build.json").read_text())
          assert report["format"] == "hmod"
          assert report["platform"] == "android"
          assert report["mod_version"] == version
          assert report["artifact"] == path.name
          assert report["size_bytes"] == path.stat().st_size
          assert report["sha256"] == sha
          print(path, len(wasm), sha)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: appleskin-android-hmod
          path: |
            target/release/*
            target/report/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appleskin-android-hmod
          path: artifact

      - name: Generate release notes
        run: python3 tools/release_notes.py artifact/report/build.json artifact/release/RELATORIO.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("horizon-mod.toml","rb"))["version"])')
          TAG="v$VERSION"
          TITLE="AppleSkin $VERSION para Horizon Android"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file artifact/release/RELATORIO.md --latest
          else
            gh release edit "$TAG" --title "$TITLE" --notes-file artifact/release/RELATORIO.md
          fi
          gh release upload "$TAG" \
            artifact/release/appleskin-*-android.hmod \
            artifact/release/appleskin-*-android.hmod.sha256 \
            artifact/release/RELATORIO.md \
            artifact/report/build.json \
            artifact/report/check.json \
            LICENSE LICENSE-APPLESKIN NOTICE \
            --clobber
